name: Atualizar relatórios

# De hora em hora. Os dados da Meta têm atraso próprio de atribuição
# (compras levam horas para estabilizar), então intervalo menor traria
# pouca informação nova.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:        # permite rodar na mão pelo painel do GitHub

# Necessário para o passo de commit conseguir escrever no repositório.
permissions:
  contents: write

concurrency:
  group: atualizar-relatorios
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A Meta pode recusar a chamada (bloqueio temporario do app, limite de
      # requisicoes, instabilidade). Nesse caso a rodada nao falha: o site
      # segue publicado com os ultimos dados bons, e a proxima hora tenta de
      # novo. Falhar aqui so geraria alarme de hora em hora sem resolver nada.
      #
      # Um cliente por vez, e a falha de um nao derruba o outro. Para incluir
      # cliente novo: acrescente o slug em CLIENTES (e a entrada em
      # scripts/meta/gerar-dados-dashboard.js e scripts/dados/clientes.json).
      - name: Puxar dados da Meta
        id: puxar
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_BUSINESS_ID: ${{ secrets.META_BUSINESS_ID }}
          META_API_VERSION: v21.0
          DESTINO_DADOS: scripts/dados
          CLIENTES: cfc-academy vital-clean
        run: |
          falhou=0
          for c in $CLIENTES; do
            echo "::group::$c"
            node scripts/meta/gerar-dados-dashboard.js "$c" || { falhou=1; echo "::warning::A Meta recusou $c nesta rodada. A página dele segue com os últimos dados bons."; }
            echo "::endgroup::"
          done
          exit $falhou

      - name: Gerar as páginas protegidas
        env:
          SENHA: ${{ secrets.SENHA_RELATORIOS }}
          SENHAS_CLIENTES: ${{ secrets.SENHAS_CLIENTES }}
        run: |
          printf '%s\n' "$SENHA" > senha.txt
          if [ -n "$SENHAS_CLIENTES" ]; then printf '%s' "$SENHAS_CLIENTES" > senhas-clientes.json; fi
          node scripts/publicar.js
          rm -f senha.txt senhas-clientes.json

      - name: Publicar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Nada mudou nesta rodada."
          else
            git commit -m "Atualiza relatórios [automático]"
            git push
          fi
